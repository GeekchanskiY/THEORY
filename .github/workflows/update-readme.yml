name: Update vault README

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/update_vault_readme.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    # Avoid a loop when this workflow commits an unchanged-policy README update.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Refresh README stats
        run: python3 scripts/update_vault_readme.py

      - name: Commit README if stats changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh vault README stats"
          file_pattern: README.md
